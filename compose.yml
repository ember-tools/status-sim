name: status-sim

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:8000
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
